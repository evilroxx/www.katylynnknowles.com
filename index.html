<style>
  :root {
    /* Palette (default: warm cream / ink / terracotta) */
    --paper: #f4ede0;
    --paper-2: #ebe2d0;
    --paper-3: #e2d6bf;
    --ink: #1a1714;
    --ink-2: #3a3530;
    --mute: rgba(26, 23, 20, 0.58);
    --rule: rgba(26, 23, 20, 0.16);
    --accent: #a8412c;
    --accent-soft: rgba(168, 65, 44, 0.12);

    /* Type */
    --font-display: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
    --font-body: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --gutter: clamp(20px, 4vw, 56px);
    --section-y: clamp(80px, 10vw, 160px);
  }

  /* Palette: midnight (theatrical) */
  [data-palette="midnight"] {
    --paper: #131214;
    --paper-2: #1c1a1d;
    --paper-3: #25232a;
    --ink: #f1ebe0;
    --ink-2: #c8c0b3;
    --mute: rgba(241, 235, 224, 0.55);
    --rule: rgba(241, 235, 224, 0.18);
    --accent: #d68a5c;
    --accent-soft: rgba(214, 138, 92, 0.16);
  }

  /* Palette: paper (cool monochrome) */
  [data-palette="paper"] {
    --paper: #f6f5f1;
    --paper-2: #ecebe5;
    --paper-3: #e1dfd6;
    --ink: #15161a;
    --ink-2: #353740;
    --mute: rgba(21, 22, 26, 0.55);
    --rule: rgba(21, 22, 26, 0.15);
    --accent: #2c4a6b;
    --accent-soft: rgba(44, 74, 107, 0.1);
  }

  /* Palette: oxblood */
  [data-palette="oxblood"] {
    --paper: #ede4d4;
    --paper-2: #e3d8c4;
    --paper-3: #d6c8af;
    --ink: #20120f;
    --ink-2: #4a2a24;
    --mute: rgba(32, 18, 15, 0.6);
    --rule: rgba(32, 18, 15, 0.18);
    --accent: #6a1d20;
    --accent-soft: rgba(106, 29, 32, 0.12);
  }

  /* Type pairing variants */
  [data-type="classic"] {
    --font-display: "Instrument Serif", Georgia, serif;
    --font-body: "Inter Tight", system-ui, sans-serif;
  }
  [data-type="sansforward"] {
    --font-display: "Inter Tight", system-ui, sans-serif;
    --font-body: "Inter Tight", system-ui, sans-serif;
  }
  [data-type="literary"] {
    --font-display: "Instrument Serif", Georgia, serif;
    --font-body: "Instrument Serif", Georgia, serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 16px;
    line-height: 1.55;
    transition: background 220ms ease, color 220ms ease;
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--paper); }

  /* ---------- Layout ---------- */
  .shell { max-width: 1480px; margin: 0 auto; padding: 0 var(--gutter); }
  .section { padding: var(--section-y) 0; position: relative; }
  .section + .section { border-top: 1px solid var(--rule); }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mute);
    font-weight: 500;
  }
  .display {
    font-family: var(--font-display);
    font-weight: 400;
    line-height: 0.98;
    letter-spacing: -0.015em;
  }
  .display em, .display .italic { font-style: italic; }

  .h-1 { font-size: clamp(48px, 8.5vw, 132px); }
  .h-2 { font-size: clamp(40px, 6vw, 88px); }
  .h-3 { font-size: clamp(28px, 3.6vw, 56px); }
  .h-4 { font-size: clamp(22px, 2.4vw, 34px); }

  .body-lg { font-size: clamp(18px, 1.4vw, 22px); line-height: 1.5; }
  .body-md { font-size: 16px; line-height: 1.7; }
  .body-sm { font-size: 14px; line-height: 1.6; color: var(--ink-2); }

  hr.rule {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 32px 0;
  }

  .section-head {
    display: grid;
    grid-template-columns: minmax(0, 220px) 1fr;
    gap: clamp(24px, 4vw, 80px);
    align-items: baseline;
    margin-bottom: clamp(40px, 5vw, 80px);
  }
  .section-head .num { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; color: var(--mute); }
  .section-head h2 { margin: 0; }
  .section-head .lead { max-width: 56ch; color: var(--ink-2); }

  /* ---------- Nav ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: color-mix(in oklab, var(--paper) 88%, transparent);
    backdrop-filter: saturate(160%) blur(14px);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--rule);
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    gap: 24px;
  }
  .brand {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 22px;
    letter-spacing: -0.01em;
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--paper);
    display: grid; place-items: center;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 16px;
    line-height: 1;
    padding-bottom: 2px;
  }
  .nav-links {
    display: flex; gap: clamp(8px, 1.5vw, 24px);
    list-style: none; margin: 0; padding: 0;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .nav-links a {
    color: var(--ink-2);
    padding: 6px 4px;
    position: relative;
    transition: color 160ms ease;
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a.active { color: var(--accent); }
  .nav-links a.active::after {
    content: "";
    position: absolute;
    left: 4px; right: 4px;
    bottom: -2px;
    height: 1px;
    background: var(--accent);
  }
  .nav-cta {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: 1px solid var(--ink);
    padding: 8px 14px;
    border-radius: 100px;
    transition: all 160ms ease;
  }
  .nav-cta:hover { background: var(--ink); color: var(--paper); }

  @media (max-width: 840px) {
    .nav-links { display: none; }
  }

  /* ---------- Hero ---------- */
  .hero { padding-top: clamp(48px, 7vw, 96px); padding-bottom: clamp(60px, 8vw, 120px); }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: clamp(28px, 5vw, 80px);
    align-items: end;
  }
  @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } }

  .hero-meta {
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 3vw, 36px);
  }
  .hero-pos {
    font-family: var(--font-display);
    font-size: clamp(54px, 9.5vw, 156px);
    line-height: 0.92;
    letter-spacing: -0.025em;
    margin: 0;
  }
  .hero-pos .accent { color: var(--accent); }
  .hero-pos em { font-style: italic; color: var(--ink-2); }

  .hero-roles {
    display: flex; flex-wrap: wrap; gap: 6px 18px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .hero-roles .dot { color: var(--accent); }

  .hero-portrait {
    position: relative;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    border-radius: 2px;
    background: var(--paper-2);
  }
  .hero-portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 22%;
    filter: contrast(1.02) saturate(0.95);
  }
  .hero-portrait::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 60%, color-mix(in oklab, var(--paper) 35%, transparent) 100%);
    pointer-events: none;
  }
  .hero-caption {
    position: absolute;
    left: 16px; bottom: 16px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--paper);
    background: rgba(0,0,0,0.35);
    padding: 6px 10px;
    border-radius: 100px;
    backdrop-filter: blur(6px);
  }

  .hero-foot {
    margin-top: clamp(40px, 6vw, 80px);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    padding-top: 28px;
    border-top: 1px solid var(--rule);
  }
  .hero-foot .col { font-size: 13px; color: var(--ink-2); }
  .hero-foot .meta-num {
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(32px, 4vw, 48px);
    line-height: 1;
    color: var(--accent);
  }

  /* Marquee hero variant */
  .marquee-name {
    font-family: var(--font-display);
    line-height: 0.86;
    letter-spacing: -0.04em;
    margin: 0;
  }
  .marquee-name .line { display: block; }
  .marquee-name .first { font-size: clamp(80px, 16vw, 240px); }
  .marquee-name .last  { font-size: clamp(80px, 16vw, 240px); font-style: italic; padding-left: clamp(40px, 12vw, 200px); color: var(--accent); }
  .marquee-band {
    display: grid;
    grid-template-columns: 0.6fr 1fr 0.6fr;
    gap: 24px;
    align-items: stretch;
    margin-top: clamp(28px, 4vw, 56px);
  }
  .marquee-band .strip {
    aspect-ratio: 3/4;
    overflow: hidden;
    background: var(--paper-2);
  }
  .marquee-band .strip img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .marquee-band .pull {
    align-self: end;
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(20px, 2.2vw, 32px);
    line-height: 1.2;
    color: var(--ink-2);
    padding: 24px 0;
  }

  /* Portrait hero variant */
  .portrait-hero { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 80px); align-items: stretch; min-height: 78vh; }
  @media (max-width: 900px) { .portrait-hero { grid-template-columns: 1fr; min-height: auto; } }
  .portrait-hero .left { display: flex; flex-direction: column; justify-content: space-between; padding: clamp(20px, 3vw, 40px) 0; }
  .portrait-hero .name {
    font-family: var(--font-display);
    font-size: clamp(60px, 11vw, 180px);
    line-height: 0.9;
    letter-spacing: -0.025em;
    margin: 0;
  }
  .portrait-hero .name .it { font-style: italic; color: var(--accent); }
  .portrait-hero .right { background: var(--paper-2); overflow: hidden; }
  .portrait-hero .right img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }

  /* ---------- Star rule (theatrical motif) ---------- */
  .star-rule {
    display: flex; align-items: center; gap: 12px;
    color: var(--mute);
  }
  .star-rule::before, .star-rule::after {
    content: ""; flex: 1; height: 1px; background: var(--rule);
  }
  .star-rule svg { width: 12px; height: 12px; opacity: 0.6; }

  /* ---------- About / Values ---------- */
  .values-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(20px, 2.6vw, 40px);
  }
  @media (max-width: 800px) { .values-grid { grid-template-columns: 1fr; } }
  .value {
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 16px;
    padding: 20px 0;
    border-top: 1px solid var(--rule);
  }
  .value .idx {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--accent);
    padding-top: 4px;
  }
  .value p { margin: 0; font-size: 15.5px; line-height: 1.65; color: var(--ink-2); }
  .value p strong { color: var(--ink); font-weight: 600; }

  .pull-quote {
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(28px, 4.5vw, 56px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    max-width: 22ch;
    margin: 0;
  }
  .pull-quote .accent { color: var(--accent); }

  /* ---------- Educator ---------- */
  .educator-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: clamp(28px, 4vw, 64px);
    align-items: start;
  }
  @media (max-width: 900px) { .educator-grid { grid-template-columns: 1fr; } }

  .philosophy { font-size: clamp(18px, 1.4vw, 22px); line-height: 1.55; color: var(--ink-2); }
  .philosophy .first { font-family: var(--font-display); font-size: clamp(28px, 3.4vw, 44px); float: left; line-height: 0.85; padding: 8px 12px 0 0; color: var(--accent); }

  .inspirations {
    background: var(--paper-2);
    padding: clamp(24px, 3vw, 40px);
    border-radius: 2px;
  }
  .inspirations h4 {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mute);
    margin: 0 0 20px 0;
    font-weight: 500;
  }
  .inspirations ul { list-style: none; margin: 0; padding: 0; }
  .inspirations li {
    font-family: var(--font-display);
    font-size: clamp(20px, 1.8vw, 26px);
    line-height: 1.4;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  .inspirations li:last-child { border-bottom: none; }
  .inspirations li .craft {
    font-family: var(--font-mono);
    font-style: normal;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .inspirations li:hover { color: var(--accent); }

  /* ---------- Journey ---------- */
  .journey-intro {
    text-align: center;
    margin-bottom: clamp(40px, 6vw, 80px);
  }
  .journey-intro .big {
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(40px, 6vw, 88px);
    line-height: 1.05;
    margin: 0;
  }
  .journey-intro .big .accent { color: var(--accent); }

  .timeline {
    position: relative;
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 0;
  }
  .timeline::before {
    content: ""; position: absolute;
    left: 120px; top: 0; bottom: 0;
    width: 1px;
    background: var(--rule);
  }
  @media (max-width: 700px) { .timeline::before { left: 8px; } }

  .tl-row {
    display: grid;
    grid-template-columns: 120px 40px 1fr;
    gap: 16px;
    padding: 14px 0;
    align-items: start;
  }
  @media (max-width: 700px) { .tl-row { grid-template-columns: 0 40px 1fr; } .tl-year { display: none; } }
  .tl-year {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-align: right;
    padding-right: 16px;
    padding-top: 4px;
  }
  .tl-dot {
    position: relative;
    width: 40px;
    display: flex; justify-content: center;
    padding-top: 6px;
  }
  .tl-dot::after {
    content: "";
    width: 9px; height: 9px;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 50%;
    z-index: 1;
  }
  .tl-row.major .tl-dot::after { background: var(--accent); border-color: var(--accent); }
  .tl-card {
    padding: 0 0 16px 0;
  }
  .tl-card .title {
    font-family: var(--font-display);
    font-size: clamp(20px, 1.9vw, 28px);
    line-height: 1.2;
    margin: 0 0 2px 0;
  }
  .tl-card .sub {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
    line-height: 1.5;
  }
  .tl-card .mob-year {
    display: none;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }
  @media (max-width: 700px) { .tl-card .mob-year { display: block; } }

  /* ---------- Portfolio ---------- */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: clamp(12px, 1.6vw, 24px);
  }
  @media (max-width: 900px) { .portfolio-grid { grid-template-columns: repeat(2, 1fr); } }
  .portfolio-grid > .pcard { grid-column: span 4; }
  /* Asymmetric layout */
  .portfolio-grid > .pcard.tall { grid-column: span 4; grid-row: span 2; }
  .portfolio-grid > .pcard.wide { grid-column: span 8; }
  .portfolio-grid > .pcard.half { grid-column: span 6; }
  @media (max-width: 900px) {
    .portfolio-grid > .pcard,
    .portfolio-grid > .pcard.tall,
    .portfolio-grid > .pcard.wide,
    .portfolio-grid > .pcard.half { grid-column: span 1; grid-row: auto; }
  }

  .pcard {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: var(--paper-2);
    aspect-ratio: 4 / 3;
    transition: transform 280ms cubic-bezier(.2,.7,.2,1);
  }
  .pcard.tall { aspect-ratio: 4 / 5; }
  .pcard.wide { aspect-ratio: 16 / 9; }
  .pcard.half { aspect-ratio: 3 / 2; }
  .pcard:hover { transform: translateY(-2px); }
  .pcard .img {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transition: transform 800ms cubic-bezier(.2,.7,.2,1), filter 400ms ease;
  }
  .pcard:hover .img { transform: scale(1.04); filter: brightness(0.7); }

  .pcard .meta {
    position: absolute;
    inset: 0;
    padding: clamp(16px, 2vw, 24px);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
    color: #fff;
    background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.55) 100%);
    opacity: 1;
    transition: opacity 240ms ease;
  }
  .pcard .role {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.92;
  }
  .pcard .title {
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(22px, 2.2vw, 32px);
    line-height: 1.1;
    margin: 0;
  }
  .pcard .corner {
    position: absolute;
    top: 14px; right: 14px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.7);
    color: #fff;
    display: grid; place-items: center;
    opacity: 0;
    transition: opacity 220ms ease, transform 220ms ease;
    transform: translateY(-4px);
  }
  .pcard:hover .corner { opacity: 1; transform: translateY(0); }
  .pcard .corner svg { width: 14px; height: 14px; }

  .pcard.video .img {
    background-image: linear-gradient(135deg, var(--accent), var(--ink));
  }
  .pcard.video::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15), transparent 60%);
  }

  /* ---------- Resume ---------- */
  .resume-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(20px, 3vw, 40px);
  }
  @media (max-width: 800px) { .resume-grid { grid-template-columns: 1fr; } }
  .resume-card {
    border: 1px solid var(--rule);
    padding: clamp(28px, 3vw, 40px);
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: var(--paper);
    transition: background 220ms ease, border-color 220ms ease;
  }
  .resume-card:hover { background: var(--paper-2); border-color: var(--ink); }
  .resume-card .preview {
    aspect-ratio: 8.5 / 11;
    overflow: hidden;
    background: var(--paper-2);
    border: 1px solid var(--rule);
  }
  .resume-card .preview img { width: 100%; height: 100%; object-fit: cover; object-position: top center; filter: contrast(0.95); }
  .resume-card .label {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--mute);
  }
  .resume-card h3 {
    font-family: var(--font-display);
    font-size: clamp(28px, 3vw, 40px);
    margin: 0;
    line-height: 1.05;
  }
  .resume-card .download {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .resume-card .download svg { width: 14px; height: 14px; }

  /* ---------- Testimonials ---------- */
  .test-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(20px, 2.6vw, 40px);
  }
  @media (max-width: 800px) { .test-grid { grid-template-columns: 1fr; } }
  .test {
    padding: clamp(24px, 3vw, 36px);
    border: 1px solid var(--rule);
    background: var(--paper);
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
  }
  .test::before {
    content: "\201C";
    position: absolute;
    top: -18px;
    left: 18px;
    font-family: var(--font-display);
    font-size: 88px;
    line-height: 1;
    color: var(--accent);
  }
  .test p {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(18px, 1.5vw, 22px);
    line-height: 1.4;
    color: var(--ink-2);
  }
  .test footer {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
    line-height: 1.6;
  }
  .test footer .name { color: var(--ink); font-weight: 500; }

  /* ---------- Footer / Contact ---------- */
  .footer {
    padding: clamp(80px, 10vw, 140px) 0 32px 0;
    background: var(--paper-2);
    border-top: 1px solid var(--rule);
  }
  .footer-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 60px;
    align-items: end;
  }
  @media (max-width: 800px) { .footer-grid { grid-template-columns: 1fr; align-items: start; } }
  .footer h2 {
    font-family: var(--font-display);
    font-size: clamp(48px, 7.5vw, 120px);
    line-height: 0.95;
    margin: 0 0 28px 0;
    letter-spacing: -0.02em;
  }
  .footer h2 .it { font-style: italic; color: var(--accent); }
  .footer .contact {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .footer .contact a {
    font-family: var(--font-display);
    font-size: clamp(20px, 2vw, 28px);
    color: var(--ink-2);
    border-bottom: 1px solid transparent;
    transition: color 160ms ease, border-color 160ms ease;
    width: fit-content;
  }
  .footer .contact a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .footer .links {
    display: flex; gap: 20px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .footer .links a {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink-2);
    border: 1px solid var(--rule);
    padding: 10px 14px;
    border-radius: 100px;
    transition: all 160ms ease;
  }
  .footer .links a:hover { color: var(--accent); border-color: var(--accent); }

  .colophon {
    margin-top: clamp(40px, 6vw, 80px);
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    display: flex; justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
  }
  @media (max-width: 600px) { .colophon { flex-direction: column; gap: 8px; } }

  /* ---------- Lightbox ---------- */
  .lb-backdrop {
    position: fixed; inset: 0;
    background: rgba(8, 6, 4, 0.86);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: grid; place-items: center;
    padding: clamp(16px, 3vw, 40px);
    animation: lbIn 220ms ease;
  }
  @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }
  .lb {
    width: min(1280px, 100%);
    max-height: 92vh;
    background: var(--paper);
    color: var(--ink);
    display: grid;
    grid-template-columns: 1fr 360px;
    overflow: hidden;
    position: relative;
  }
  @media (max-width: 900px) { .lb { grid-template-columns: 1fr; max-height: 96vh; } }

  .lb-stage {
    position: relative;
    background: var(--ink);
    aspect-ratio: 16 / 11;
    overflow: hidden;
  }
  .lb-stage .frame { position: absolute; inset: 0; opacity: 0; transition: opacity 360ms ease; }
  .lb-stage .frame.active { opacity: 1; }
  .lb-stage .frame img { width: 100%; height: 100%; object-fit: contain; background: var(--ink); }

  .lb-nav-btn {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(6px);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    display: grid; place-items: center;
    cursor: pointer;
    transition: background 160ms ease;
    z-index: 2;
  }
  .lb-nav-btn:hover { background: rgba(255,255,255,0.22); }
  .lb-nav-btn.prev { left: 16px; }
  .lb-nav-btn.next { right: 16px; }
  .lb-nav-btn svg { width: 18px; height: 18px; }

  .lb-counter {
    position: absolute;
    bottom: 16px; left: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: #fff;
    background: rgba(0,0,0,0.4);
    padding: 6px 10px;
    border-radius: 100px;
    z-index: 2;
  }

  .lb-info {
    padding: clamp(24px, 2.4vw, 36px);
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
  }
  .lb-info .eyebrow { color: var(--accent); }
  .lb-info h3 {
    font-family: var(--font-display);
    font-size: clamp(28px, 2.6vw, 40px);
    line-height: 1.05;
    margin: 0;
  }
  .lb-info .role {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .lb-info .body { color: var(--ink-2); font-size: 14.5px; line-height: 1.65; }

  .lb-thumbs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: auto;
  }
  .lb-thumb {
    aspect-ratio: 4/3;
    background-size: cover; background-position: center;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 160ms ease;
    border: 1px solid transparent;
  }
  .lb-thumb:hover { opacity: 0.85; }
  .lb-thumb.active { opacity: 1; border-color: var(--accent); }

  .lb-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    display: grid; place-items: center;
    z-index: 3;
    transition: transform 160ms ease;
  }
  .lb-close:hover { transform: rotate(90deg); }
  .lb-close svg { width: 14px; height: 14px; }

  /* ---------- Reveal animations ---------- */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity 700ms ease, transform 700ms cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }

  /* ---------- Misc ---------- */
  .scrollspy-marker { position: absolute; top: -120px; }

  body.lb-open { overflow: hidden; }

  /* Tweaks panel base styling tweaks */
  .tweaks-panel-host { z-index: 999 !important; }
  /* Back pill */
  .back-pill {
    position: fixed; left: 16px; bottom: 16px;
    z-index: 80;
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 10px 14px; border-radius: 100px;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all 160ms ease;
  }
  .back-pill:hover { color: var(--accent); border-color: var(--accent); }
  .back-pill svg { width: 12px; height: 12px; }

  /* ---------- Now ticker ---------- */
  .ticker {
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    overflow: hidden;
    position: relative;
  }
  .ticker-track {
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 14px 0;
    white-space: nowrap;
    animation: tickerMove 38s linear infinite;
    will-change: transform;
  }
  @keyframes tickerMove {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ticker .item {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .ticker .item .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .ticker .item .lab {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 16px;
    letter-spacing: -0.005em;
    color: var(--ink);
    text-transform: none;
  }
  .ticker .item.live .dot {
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(168, 65, 44, 0.55); }
    70% { box-shadow: 0 0 0 8px rgba(168, 65, 44, 0); }
    100% { box-shadow: 0 0 0 0 rgba(168, 65, 44, 0); }
  }
  .ticker .sep {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1px solid var(--rule);
    flex-shrink: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; }
  }

  /* ---------- Contact form section ---------- */
  .contact-section {
    padding: var(--section-y) 0;
    border-top: 1px solid var(--rule);
  }
  .contact-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(40px, 6vw, 96px);
    align-items: start;
  }
  @media (max-width: 900px) { .contact-layout { grid-template-columns: 1fr; } }

  .contact-left .lede {
    font-family: var(--font-display);
    font-size: clamp(40px, 6vw, 84px);
    line-height: 0.96;
    letter-spacing: -0.015em;
    margin: 18px 0 32px 0;
  }
  .contact-left .lede em { font-style: italic; color: var(--accent); }
  .contact-left .quick {
    display: flex; flex-direction: column; gap: 14px;
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
  }
  .contact-left .quick .row {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 16px;
    align-items: baseline;
  }
  .contact-left .quick .k {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .contact-left .quick a {
    font-family: var(--font-display);
    font-size: clamp(18px, 1.5vw, 22px);
    color: var(--ink);
    border-bottom: 1px solid transparent;
    transition: color 160ms ease, border-color 160ms ease;
    width: fit-content;
  }
  .contact-left .quick a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .form {
    display: flex; flex-direction: column; gap: 18px;
  }
  .field {
    display: flex; flex-direction: column; gap: 6px;
  }
  .field label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .field input,
  .field select,
  .field textarea {
    font: inherit;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 12px 0;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: clamp(18px, 1.4vw, 22px);
    line-height: 1.4;
    border-radius: 0;
    transition: border-color 160ms ease;
  }
  .field input::placeholder,
  .field textarea::placeholder { color: var(--mute); }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
  .field textarea { resize: vertical; min-height: 120px; }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 600px) { .field-row { grid-template-columns: 1fr; } }

  .submit-row {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .submit-row .note {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .submit-btn {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 14px 22px;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 100px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px;
    transition: background 160ms ease, color 160ms ease;
  }
  .submit-btn:hover { background: var(--accent); border-color: var(--accent); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .submit-btn svg { width: 12px; height: 12px; }

  .form-success {
    padding: clamp(24px, 3vw, 36px);
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 2px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .form-success h3 {
    font-family: var(--font-display);
    font-size: clamp(22px, 2vw, 28px);
    margin: 0;
    color: var(--accent);
  }
  .form-success p { margin: 0; color: var(--ink-2); }
</style>
